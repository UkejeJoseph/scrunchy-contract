[package]
name = "marketplace"
version = "0.1.0"
description = "Scrunchy Marketplace Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "marketplace"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = "0.31.0"
# Use only token feature to avoid solana-program version conflict
anchor-spl = { version = "0.31.0", default-features = false, features = ["token"] }
spl-token = "7.0.0"

